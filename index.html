body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #FAFAF8; color: #1A1A1A; -webkit-font-smoothing: antialiased; }

/* App container - full screen on mobile, centered on desktop */

/* Status bar */

.wx-status-title { font-size: 17px; font-weight: 600; color: #1A1A1A; }

.wx-status-capsule .capsule-dots { display: flex; gap: 3px; align-items: center; }
.wx-status-capsule .capsule-dots span { width: 5px; height: 5px; border-radius: 50%; background: #333; }

.wx-status-capsule .capsule-close { width: 14px; height: 14px; position: relative; }

.wx-status-capsule .capsule-close::before { transform: translate(-50%, -50%) rotate(45deg); }
.wx-status-capsule .capsule-close::after { transform: translate(-50%, -50%) rotate(-45deg); }

/* Custom header */
.custom-header { background: #fff; padding: 8px 16px 12px; display: flex; align-items: center; justify-content: center; position: sticky; top: 44px; z-index: 99; border-bottom: 0.5px solid #f0f0f0; }
.header-search { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; cursor: pointer; }
.header-search svg { width: 22px; height: 22px; }
.header-title { font-size: 18px; font-weight: 600; color: #1A1A1A; letter-spacing: 0.5px; }

/* Content area */
.content { padding: 0 0 20px; }

/* Section */
.section { margin-top: 16px; }
.section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px; }
.section-title { font-size: 16px; font-weight: 700; color: #1A1A1A; }
.section-more { font-size: 12px; color: #999; cursor: pointer; }

/* Student carousel */
.student-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.student-scroll::-webkit-scrollbar { display: none; }
.student-card { flex-shrink: 0; width: 130px; background: linear-gradient(180deg, #F5F0E8 0%, #FFFFFF 100%); border-radius: 14px; padding: 16px 12px 12px; text-align: center; cursor: pointer; transition: transform 0.2s; }
.student-card:hover { transform: translateY(-2px); }
.student-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; display: block; background: #f0f0f0; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.student-name { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.student-tag { font-size: 11px; color: #999; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.student-btn { display: inline-block; font-size: 12px; color: #8B6F47; border: 1px solid #8B6F47; border-radius: 12px; padding: 2px 14px; cursor: pointer; }

/* Tabs */
.tabs { display: flex; align-items: center; gap: 20px; }
.tab { font-size: 14px; color: #666; cursor: pointer; position: relative; padding-bottom: 4px; }
.tab.active { color: #1A1A1A; font-weight: 600; }
.tab.active::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 20px; height: 2px; background: #8B6F47; border-radius: 1px; }

/* Case feed */
.case-feed { padding: 0 16px; }
.case-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }

.author-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

.author-tag { font-size: 11px; color: #666; background: #F5F0E8; border-radius: 4px; padding: 1px 6px; display: inline-block; margin-top: 2px; }
.badge-featured { font-size: 10px; color: #fff; background: linear-gradient(135deg, #C8956D, #D4A574); border-radius: 4px; padding: 1px 6px; font-weight: 500; }

.case-title { font-size: 15px; font-weight: 600; color: #1A1A1A; line-height: 1.5; margin-bottom: 6px; }
.case-body { font-size: 14px; color: #555; line-height: 1.6; }
.case-body .full-text-link { color: #8B6F47; font-size: 14px; cursor: pointer; }

/* Case images */
.case-images { display: flex; gap: 6px; margin-top: 10px; border-radius: 8px; overflow: hidden; }
.case-img-item { flex: 1; aspect-ratio: 1; border-radius: 6px; overflow: hidden; cursor: pointer; }
.case-img-item img { width: 100%; height: 100%; object-fit: cover; background: #f5f5f5; }

/* Interaction bar */
.interaction-bar { display: flex; align-items: center; gap: 24px; margin-top: 12px; padding-top: 10px; border-top: 0.5px solid #f0f0f0; }
.interaction-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #999; cursor: pointer; }

.interaction-share { margin-left: auto; }

/* Bottom tab bar */
.tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: #fff; display: flex; align-items: center; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); border-top: 0.5px solid #eee; z-index: 200; }
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; flex: 1; }
.tab-item-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.tab-item-icon svg { width: 22px; height: 22px; }
.tab-item-label { font-size: 10px; color: #999; }
.tab-item.active .tab-item-label { color: #8B6F47; font-weight: 600; }

/* Category overlay */
.category-overlay { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 100vh; background: #FAFAF8; z-index: 300; overflow-y: auto; }
.category-overlay.active { display: block; }
.cat-overlay-header { background: #fff; padding: 50px 16px 16px; position: sticky; top: 0; z-index: 10; border-bottom: 0.5px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
.cat-back { font-size: 22px; color: #1A1A1A; cursor: pointer; padding: 4px; }
.cat-overlay-title { font-size: 18px; font-weight: 600; }
.cat-overlay-info { padding: 20px 16px; background: #fff; margin-bottom: 8px; }
.cat-overlay-desc { font-size: 14px; color: #666; margin-top: 4px; }
.cat-overlay-stats { display: flex; gap: 20px; margin-top: 12px; }
.cat-stat { text-align: center; }
.cat-stat-num { font-size: 20px; font-weight: 700; color: #8B6F47; }
.cat-stat-label { font-size: 11px; color: #999; }

/* City tabs */
.city-tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: #fff; position: sticky; top: 62px; z-index: 9; scrollbar-width: none; }
.city-tabs::-webkit-scrollbar { display: none; }
.city-tab { padding: 4px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap; background: #f5f5f5; color: #666; cursor: pointer; }
.city-tab.active { background: #8B6F47; color: #fff; font-weight: 500; }

/* Case detail overlay */
.detail-overlay { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 100vh; background: #FAFAF8; z-index: 300; overflow-y: auto; }

.detail-header { background: #fff; padding: 50px 16px 16px; position: sticky; top: 0; z-index: 10; border-bottom: 0.5px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
.detail-back { font-size: 22px; color: #1A1A1A; cursor: pointer; padding: 4px; }
.detail-title { font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-content { padding: 16px; }
.detail-author { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.detail-author-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f0f0f0; }
.detail-author-name { font-size: 16px; font-weight: 600; }
.detail-author-tag { font-size: 12px; color: #666; background: #F5F0E8; border-radius: 4px; padding: 2px 8px; display: inline-block; margin-top: 2px; }
.detail-section-title { font-size: 15px; font-weight: 600; margin: 20px 0 12px; color: #1A1A1A; }
.detail-image-block { margin-bottom: 20px; }
.detail-image { width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; background: #f5f5f5; }
.detail-image-desc { font-size: 13px; color: #666; line-height: 1.6; padding: 0 4px 12px; }

/* Search overlay */
.search-overlay { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 100vh; background: #FAFAF8; z-index: 300; overflow-y: auto; }
.search-overlay.active { display: block; }
.search-header { background: #fff; padding: 50px 16px 12px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid #f0f0f0; }
.search-back { font-size: 22px; cursor: pointer; padding: 4px; }
.search-input-wrap { flex: 1; background: #f5f5f5; border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }

// Render student carousel
function renderStudents() {
  const scroll = document.getElementById('studentScroll');
  scroll.innerHTML = DATA.featuredStudents.map(s => `
    <div class="student-card" onclick="openDetail('${s.id}')">
      <img class="student-avatar" src="${s.authorAvatar}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22><rect fill=%22%23F5F0E8%22 width=%2256%22 height=%2256%22/></svg>'">

      <div class="student-tag">${s.tagIcon} ${escapeHtml(s.tag)}</div>
      <span class="student-btn">查看</span>
    </div>
  `).join('');
}

// Switch tab
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  currentCases = tab === 'recommended' ? DATA.recommended : DATA.latest;
  renderCases(currentCases);
}

// Open detail
function openDetail(id) {
  const allCases = [...DATA.recommended, ...DATA.latest];
  const caseData = allCases.find(c => c.id === id) || DATA.featuredStudents.find(c => c.id === id);
  if (!caseData) return;
  
  document.getElementById('detailTitle').textContent = caseData.authorName;
  const content = document.getElementById('detailContent');
  
  let html = `
    <div class="detail-author">
      <img class="detail-author-avatar" src="${caseData.authorAvatar}" alt="" onerror="this.style.background='#f0f0f0'">
      <div>
        <div class="detail-author-name">${escapeHtml(caseData.authorName)}</div>
        <span class="detail-author-tag">${caseData.tagIcon} ${escapeHtml(caseData.tag)} ${caseData.city ? '· ' + escapeHtml(caseData.city) : ''}</span>
      </div>
    </div>
    <div class="case-title">${escapeHtml(caseData.title)}</div>
    
  `;
  
  const groups = caseData.labelGroups && caseData.labelGroups.length
    ? caseData.labelGroups
    : [{text:'',images:caseData.allImages.map(i=>i.path)}];
  const previewUrls = groups.flatMap(g=>g.images);
  groups.forEach(group => {
    html += `<div class="detail-label-group">`;
    if (group.text) html += `<div class="detail-label-text">${escapeHtml(group.text)}</div>`;
    group.images.forEach(path => {
      html += `<img class="detail-image" src="${path}" alt="" loading="lazy" onclick="previewImage('${path}', ${JSON.stringify(previewUrls)})" onerror="this.style.display='none'">`;
    });
    html += `</div>`;
  });
  
  content.innerHTML = html;
  document.getElementById('detailOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

// Open category
function openCategory(catId) {
  const cat = DATA.categories.find(c => c.id === catId);
  if (!cat) return;
  
  document.getElementById('catOverlayTitle').textContent = cat.title + ' ' + cat.icon;
  
  const info = document.getElementById('catOverlayInfo');
  info.innerHTML = `
    <div style="font-size: 18px; font-weight: 700; color: #1A1A1A;">${cat.icon} ${escapeHtml(cat.title)}</div>
    <div class="cat-overlay-desc">${escapeHtml(cat.desc)}</div>
    <div class="cat-overlay-stats">
      <div class="cat-stat"><div class="cat-stat-num">${cat.stats.caseCount}</div><div class="cat-stat-label">案例</div></div>
      <div class="cat-stat"><div class="cat-stat-num">${cat.stats.imageCount}</div><div class="cat-stat-label">配图</div></div>
      <div class="cat-stat"><div class="cat-stat-num">${cat.stats.cityCount}</div><div class="cat-stat-label">城市</div></div>
    </div>
  `;
  
  // City tabs
  const cityTabs = document.getElementById('cityTabs');
  const allCities = [{title: '全部', cases: cat.cities.flatMap(c => c.cases)}];
  const cities = [...allCities, ...cat.cities];
  
  cityTabs.innerHTML = cities.map((city, idx) => 
    `<div class="city-tab ${idx === 0 ? 'active' : ''}" onclick="switchCity(${idx}, ${JSON.stringify(cities.map(c => c.cases)).replace(/"/g, '&quot;')})">${escapeHtml(city.title)}</div>`
  ).join('');
  
  // Show all cases
  const allCatCases = cat.cities.flatMap(c => c.cases);
  renderCatCases(allCatCases);
  
  document.getElementById('categoryOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

// Search
function openSearch() {
  document.getElementById('searchOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('searchInput').focus(), 100);
}

function normalizeSearchText(value) {
  let text = String(value || '').toLowerCase().replace(/[\s·_—\-，。！？：:（）()]/g, '');
  const aliases = [
    [/红薯|小红书/g,'小红书'],[/皮管|皮肤|痘痘|祛痘/g,'皮肤管理'],
    [/瘦身|减肥|塑形/g,'身材管理'],[/半永久|文绣|纹秀/g,'纹绣'],
    [/头流|投放|聚光/g,'投流'],[/克资|客户|新客|获客|引流/g,'客资'],
    [/思域|朋友圈/g,'私域'],[/货客/g,'获客'],[/变线|挣钱|赚钱|业绩/g,'变现'],
    [/成叫|收钱|收款|定金/g,'成交'],[/巨光/g,'聚光'],[/蓝微/g,'蓝v']
  ];
  aliases.forEach(([pattern,replacement]) => { text = text.replace(pattern,replacement); });
  return text;
}

function onSearchInput(val) {
  if (!val.trim()) {
    document.getElementById('searchBody').innerHTML = `
      <div class="search-history">
        <div class="search-history-title">热门搜索</div>
        <div class="search-history-tags">
          <span class="search-history-tag" onclick="quickSearch('皮肤管理')">皮肤管理</span>
          <span class="search-history-tag" onclick="quickSearch('私域成交')">私域成交</span>
          <span class="search-history-tag" onclick="quickSearch('成都')">成都</span>
          <span class="search-history-tag" onclick="quickSearch('投放报喜')">投放报喜</span>
          <span class="search-history-tag" onclick="quickSearch('学员表白')">学员表白</span>
          <span class="search-history-tag" onclick="quickSearch('纹眉')">纹眉</span>
        </div>
      </div>
    `;
    return;
  }
  
  const kw = normalizeSearchText(val);
  const results = [...DATA.recommended].filter(c => 
    normalizeSearchText([c.authorName,c.title,c.category,c.city,c.bodyText,c.fullText].join(' ')).includes(kw)
  );
  
  document.getElementById('searchBody').innerHTML = `
    <div class="search-results">
      <div class="search-result-count">找到 ${results.length} 条结果</div>
      ${results.length > 0 ? results.map(c => `
        <div class="case-card" onclick="openDetail('${c.id}')">
          <div class="author-row">
            <img class="author-avatar" src="${c.authorAvatar}" alt="" onerror="this.style.background='#f0f0f0'">
            <div class="author-info">
              <div class="author-name">${escapeHtml(c.authorName)}</div>
              <span class="author-tag">${c.tagIcon} ${escapeHtml(c.tag)} ${c.city ? '· ' + escapeHtml(c.city) : ''}</span>
            </div>
          </div>
          <div class="case-title">${escapeHtml(c.title)}</div>
          ${c.bodyText ? `<div class="case-body">${escapeHtml(c.bodyText.substring(0, 80))}...</div>` : ''}
        </div>
      `).join('') : '<div class="loading">未找到相关案例</div>'}
    </div>
  `;
}

function quickSearch(kw) {
  document.getElementById('searchInput').value = kw;
  onSearchInput(kw);
}

  const idx = urls.indexOf(current);
  if (idx >= 0) {
    window.open(current, '_blank');
  }
}

  // Only 案例 tab exists, no action needed

// Escape HTML
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// PWA Install Prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (!deferredPrompt) return;
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#8B6F47;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-width:360px;';
  banner.innerHTML = '<span>安装到桌面，离线也能看</span><button id="installBtn" style="background:#fff;color:#8B6F47;border:none;border-radius:8px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">安装</button><button id="closeBtn" style="background:transparent;color:#fff;border:none;font-size:18px;cursor:pointer;opacity:0.7;">×</button>';
  document.body.appendChild(banner);
  document.getElementById('installBtn').onclick = async () => {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      banner.remove();
    }
    deferredPrompt = null;
  };
  document.getElementById('closeBtn').onclick = () => banner.remove();
}
